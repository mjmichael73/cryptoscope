# Standalone image for regenerating protobuf stubs.
# Needs protoc, Go plugins, and Python grpcio-tools.
FROM golang:1.25-alpine

RUN apk add --no-cache protobuf py3-pip && \
    go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35 && \
    go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5 && \
    pip3 install --break-system-packages grpcio-tools~=1.62

ENTRYPOINT ["/bin/sh"]
