# command-service autoscaling. Stateless write side (PostgreSQL + Kafka
# produce); scale with care so PostgreSQL absorbs the write load.
# The HPA owns the replica count: minReplicas is the production baseline and
# the production overlay deliberately sets no `replicas` for this Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: command-service
  namespace: cryptoscope
  labels:
    app: command-service
    app.kubernetes.io/part-of: cryptoscope
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: command-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
