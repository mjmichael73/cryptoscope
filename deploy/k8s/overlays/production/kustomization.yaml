apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cryptoscope-prod

resources:
  - ../../base
  - hpa-api-gateway.yaml
  - hpa-query-service.yaml
  - hpa-command-service.yaml

namePrefix: prod-

# Production overrides: HPA-owned replica counts, stricter limits, no dev
# defaults. Note: no `replicas` patches for api-gateway, query-service or
# command-service — their HorizontalPodAutoscalers (hpa-*.yaml) own the
# replica count, and a static `replicas` field would fight the HPA on every
# `kubectl apply -k`. Requires metrics-server in the cluster.
patches:
  # Stricter resource limits for production
  - target:
      kind: Deployment
      name: ingest-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingest-service
      spec:
        template:
          spec:
            containers:
              - name: ingest-service
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 512Mi

  - target:
      kind: Deployment
      name: stream-processor
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: stream-processor
      spec:
        template:
          spec:
            containers:
              - name: stream-processor
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: "2"
                    memory: 1Gi

  # Ensure DEV_MODE is false in production
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        template:
          spec:
            containers:
              - name: api-gateway
                env:
                  - name: DEV_MODE
                    value: "false"
                  - name: LOG_LEVEL
                    value: "info"
