apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: cryptoscope
  labels:
    app: query-service
    app.kubernetes.io/part-of: cryptoscope
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: cryptoscope/query-service:latest
          ports:
            - containerPort: 8001
              name: http
            - containerPort: 9001
              name: grpc
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: CLICKHOUSE_HOST
              value: "clickhouse"
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DB
              value: "cryptoscope"
            - name: CLICKHOUSE_USER
              value: "cryptoscope"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cryptoscope-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: QUERY_SERVICE_HTTP_PORT
              value: "8001"
            - name: QUERY_SERVICE_GRPC_PORT
              value: "9001"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAMESPACE
              value: "cryptoscope"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: cryptoscope
  labels:
    app: query-service
spec:
  selector:
    app: query-service
  ports:
    - port: 8001
      targetPort: 8001
      name: http
    - port: 9001
      targetPort: 9001
      name: grpc
