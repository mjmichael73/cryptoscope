# Data store policies: each store accepts traffic only from the services
# that actually use it.  All other ingress is denied by the default-deny policy.

# PostgreSQL: command-service (writes), alert-service (triggers)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: cryptoscope
  labels:
    app.kubernetes.io/part-of: cryptoscope
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: command-service
        - podSelector:
            matchLabels:
              app: alert-service
      ports:
        - protocol: TCP
          port: 5432
---
# ClickHouse: stream-processor (writes candles), query-service (reads)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clickhouse
  namespace: cryptoscope
  labels:
    app.kubernetes.io/part-of: cryptoscope
spec:
  podSelector:
    matchLabels:
      app: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: stream-processor
        - podSelector:
            matchLabels:
              app: query-service
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
---
# MongoDB: stream-processor (raw tick archive)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongo
  namespace: cryptoscope
  labels:
    app.kubernetes.io/part-of: cryptoscope
spec:
  podSelector:
    matchLabels:
      app: mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: stream-processor
      ports:
        - protocol: TCP
          port: 27017
---
# Redis: api-gateway (rate limit), ingest-service (idempotency),
#        query-service (cache), command-service (idempotency)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: cryptoscope
  labels:
    app.kubernetes.io/part-of: cryptoscope
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: ingest-service
        - podSelector:
            matchLabels:
              app: query-service
        - podSelector:
            matchLabels:
              app: command-service
      ports:
        - protocol: TCP
          port: 6379
---
# Kafka: ingest-service (produces ticks),
#        stream-processor (consumes ticks, produces events),
#        command-service (produces events),
#        alert-service (consumes events, produces triggers)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
  namespace: cryptoscope
  labels:
    app.kubernetes.io/part-of: cryptoscope
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingest-service
        - podSelector:
            matchLabels:
              app: stream-processor
        - podSelector:
            matchLabels:
              app: command-service
        - podSelector:
            matchLabels:
              app: alert-service
      ports:
        - protocol: TCP
          port: 9092
