# Stream-processor egress:
#   - Kafka (consume ticks, publish domain events)
#   - ClickHouse (write candles)
#   - MongoDB (archive raw ticks)
#   - OTel Collector (traces)
# Ingress:
#   - Prometheus scrape (metrics port 9100)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stream-processor
  namespace: cryptoscope
  labels:
    app.kubernetes.io/part-of: cryptoscope
spec:
  podSelector:
    matchLabels:
      app: stream-processor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9100
  egress:
    # Kafka
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # ClickHouse (native protocol)
    - to:
        - podSelector:
            matchLabels:
              app: clickhouse
      ports:
        - protocol: TCP
          port: 9000
    # MongoDB
    - to:
        - podSelector:
            matchLabels:
              app: mongo
      ports:
        - protocol: TCP
          port: 27017
    # OTel Collector
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
