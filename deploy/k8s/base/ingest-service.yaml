apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: cryptoscope
  labels:
    app: ingest-service
    app.kubernetes.io/part-of: cryptoscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-service
  template:
    metadata:
      labels:
        app: ingest-service
    spec:
      containers:
        - name: ingest-service
          image: cryptoscope/ingest-service:latest
          ports:
            - containerPort: 9100
              name: metrics
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_TICKS
              value: "market.ticks.raw"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cryptoscope-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: BINANCE_BASE_URL
              value: "https://api.binance.com"
            - name: COINBASE_BASE_URL
              value: "https://api.exchange.coinbase.com"
            - name: INGEST_SYMBOLS
              value: "BTCUSDT,ETHUSDT,SOLUSDT"
            - name: INGEST_POLL_INTERVAL_SECONDS
              value: "15"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAMESPACE
              value: "cryptoscope"
            - name: PROMETHEUS_METRICS_PORT
              value: "9100"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-service
  namespace: cryptoscope
  labels:
    app: ingest-service
spec:
  selector:
    app: ingest-service
  ports:
    - port: 9100
      targetPort: 9100
      name: metrics
