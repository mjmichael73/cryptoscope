# Single-node Loki for cluster-internal log aggregation, targeted by the
# Fluent Bit DaemonSet (fluent-bit.yaml). The ConfigMap mirrors
# deploy/loki/loki-config.yaml — keep the two in sync. Single node and
# filesystem storage: fine for staging and small production clusters; for HA
# log storage run managed Loki and repoint LOKI_HOST/LOKI_PORT in
# fluent-bit.yaml instead of scaling this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: cryptoscope
  labels:
    app: loki
    app.kubernetes.io/part-of: cryptoscope
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    # Retention requires the compactor to process delete requests.
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      max_query_series: 5000

    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: cryptoscope
  labels:
    app: loki
    app.kubernetes.io/part-of: cryptoscope
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: cryptoscope
  labels:
    app: loki
    app.kubernetes.io/part-of: cryptoscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          args:
            - -config.file=/etc/loki/loki-config.yaml
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: cryptoscope
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      name: http
