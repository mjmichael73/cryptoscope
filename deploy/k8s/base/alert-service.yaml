apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: cryptoscope
  labels:
    app: alert-service
    app.kubernetes.io/part-of: cryptoscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
    spec:
      containers:
        - name: alert-service
          image: cryptoscope/alert-service:latest
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: cryptoscope-secrets
                  key: POSTGRES_DSN
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_EVENTS
              value: "domain.events"
            - name: KAFKA_TOPIC_ALERTS
              value: "alerts.triggers"
            - name: ALERT_SERVICE_HTTP_PORT
              value: "8003"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAMESPACE
              value: "cryptoscope"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: cryptoscope
  labels:
    app: alert-service
spec:
  selector:
    app: alert-service
  ports:
    - port: 8003
      targetPort: 8003
      name: http
