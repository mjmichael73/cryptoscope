# Parsers used by the Fluent Bit setups in this repository.
# Keep in sync with the ConfigMap in deploy/k8s/base/fluent-bit.yaml.

# Docker json-file container log wrapper.
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# CRI (containerd) log line format used by Kubernetes nodes.
[PARSER]
    Name        cri
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# Structured JSON emitted by the Go and Python logging libraries.
# No Time_Key on purpose: the Docker/CRI timestamp already orders the lines,
# and the Go and Python libraries use different time field names
# (slog writes "time", structlog writes "timestamp").
[PARSER]
    Name   app_json
    Format json
