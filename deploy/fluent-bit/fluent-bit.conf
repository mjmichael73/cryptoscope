# Fluent Bit → Loki log shipping for the Docker Compose stacks.
#
# Tails Docker json-file container logs (requires the containers directory to
# be mounted read-only) and forwards them to Loki with low-cardinality
# labels: app, service, level, tenant_id. trace_id stays in the log body on
# purpose so per-trace label cardinality stays bounded.
#
# The service label comes from Docker itself: the compose files set the
# json-file `labels` log option so every line carries the container's
# compose/swarm service name under `attrs`. No Docker socket required.
#
# Used by:
#   - docker-compose.yml       (opt-in: docker compose --profile logs up -d)
#   - docker-compose.prod.yml  (always on)
#
# The Kubernetes DaemonSet (deploy/k8s/base/fluent-bit.yaml) carries its own
# ConfigMap tuned for CRI log files — keep the [OUTPUT] blocks in sync.
#
# To ship to Elasticsearch instead of Loki, disable the loki output and enable
# the commented es output at the bottom.

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /var/log/fluent-bit-storage
    storage.sync  normal

# Container json-file logs — every container on the host, including Swarm
# tasks. Match *-json.log only so containers using a different daemon-default
# log driver (e.g. `local`) never emit records.
#
# Docker_Mode is deliberately OFF: it reassembles json-file lines that Docker
# split mid-write (>16KB lines, rare), but stalls the tail's last buffered
# line until the next append. Our services emit one JSON object per line far
# below the split threshold; oversized lines simply ship as two records.
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /var/log/fluent-bit-storage/docker-tail.db
    DB.Sync           Normal
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    storage.type      filesystem

# Docker stamps container labels into every json-file line (see the `labels`
# log option in the compose files). Promote the service name to the field the
# platform logs expect. The Modify filter cannot expand record accessors in
# values, so a small Lua filter does the lookup.
[FILTER]
    Name   lua
    Match  docker.*
    script /fluent-bit/etc/promote-service.lua
    call   cb_promote_service

# Parse the structured JSON every service emits (libs/go/logging and
# cryptoscope_shared.logging) to expose level and tenant_id as labels.
# Non-JSON lines keep their original fields — no data is dropped.
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       app_json
    Preserve_Key On
    Reserve_Data On

# Loki is the default log store; view logs in the bundled Grafana.
[OUTPUT]
    Name       loki
    Match      *
    Host       loki
    Port       3100
    Labels     app=cryptoscope
    Label_Keys $service,$level,$tenant_id
    Remove_Keys attrs

# Elasticsearch output kept ready for a later switch:
# [OUTPUT]
#     Name    es
#     Match   *
#     Host    elasticsearch
#     Port    9200
#     Index   cryptoscope-logs
