# Auto-provisioned Grafana dashboard config.
# Loads all JSON files from the specified directory.
#
# In Docker Compose, mount both provisioning and dashboards:
#   volumes:
#     - ./deploy/grafana/provisioning:/etc/grafana/provisioning
#     - ./deploy/grafana-dashboards:/var/lib/grafana/dashboards
#
# In Kubernetes, use ConfigMap volumes for both.
apiVersion: 1

providers:
  - name: cryptoscope
    orgId: 1
    folder: cryptoscope
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
