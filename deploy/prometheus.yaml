global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: ingest-service
    static_configs:
      - targets: ["ingest-service:9100"]

  - job_name: stream-processor
    static_configs:
      - targets: ["stream-processor:9100"]

  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9101"]

  - job_name: command-service
    metrics_path: /metrics
    static_configs:
      - targets: ["command-service:8002"]

  - job_name: query-service
    metrics_path: /metrics
    static_configs:
      - targets: ["query-service:8001"]
