[project]
name = "cryptoscope-shared"
version = "0.1.0"
description = "Shared helpers for the cryptoscope Python services"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptoscope_shared", "cryptoscope_proto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true
